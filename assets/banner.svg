<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#titleGrad);
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #e2e8f0;
      letter-spacing: 0.2px;
    }
    .tagline-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 15px;
      fill: #94a3b8;
    }
    
    /* Dynamic Animated Elements in Background Layer */
    @keyframes pulseNode {
      0%, 100% { r: 6px; opacity: 0.4; }
      50% { r: 10px; opacity: 0.9; filter: drop-shadow(0 0 8px #38bdf8); }
    }
    @keyframes dashLine {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(8px); }
      100% { transform: translateY(0px) translateX(0px); }
    }
    
    .node-anim1 { animation: pulseNode 3s infinite ease-in-out; }
    .node-anim2 { animation: pulseNode 4s infinite ease-in-out 1s; }
    .node-anim3 { animation: pulseNode 3.5s infinite ease-in-out 0.5s; }
    
    .edge-flow {
      stroke-dasharray: 8 6;
      animation: dashLine 2s linear infinite;
    }
    .particle { animation: floatParticle 5s infinite ease-in-out; }
  </style>

  <!-- Base Card Container -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Dynamic Animated Background Network Graph Layer (Behind Text) -->
  <g opacity="0.45">
    <!-- Connecting Edges -->
    <line x1="120" y1="80" x2="280" y2="160" stroke="#3b82f6" stroke-width="2" class="edge-flow" />
    <line x1="280" y1="160" x2="180" y2="250" stroke="#0284c7" stroke-width="1.5" />
    <line x1="280" y1="160" x2="450" y2="100" stroke="#6366f1" stroke-width="2" class="edge-flow" />
    <line x1="850" y1="70" x2="1020" y2="140" stroke="#3b82f6" stroke-width="2" class="edge-flow" />
    <line x1="1020" y1="140" x2="1110" y2="240" stroke="#0284c7" stroke-width="1.5" />
    <line x1="1020" y1="140" x2="890" y2="230" stroke="#818cf8" stroke-width="2" class="edge-flow" />
    <line x1="450" y1="100" x2="750" y2="260" stroke="#1e40af" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Graph Nodes -->
    <circle cx="120" cy="80" r="7" fill="#60a5fa" class="node-anim1" />
    <circle cx="280" cy="160" r="9" fill="#38bdf8" class="node-anim2" />
    <circle cx="180" cy="250" r="6" fill="#818cf8" class="node-anim3" />
    <circle cx="450" cy="100" r="8" fill="#3b82f6" class="node-anim1" />
    <circle cx="850" cy="70" r="7" fill="#93c5fd" class="node-anim3" />
    <circle cx="1020" cy="140" r="10" fill="#38bdf8" class="node-anim2" />
    <circle cx="1110" cy="240" r="6" fill="#60a5fa" class="node-anim1" />
    <circle cx="890" cy="230" r="8" fill="#818cf8" class="node-anim2" />
    
    <!-- Floating Data Particles -->
    <circle cx="600" cy="50" r="3" fill="#38bdf8" class="particle" />
    <circle cx="980" cy="280" r="4" fill="#60a5fa" class="particle" />
    <circle cx="220" cy="60" r="3" fill="#818cf8" class="particle" />
  </g>

  <!-- Foreground Foreground Container Frame / Pill Highlight -->
  <rect x="180" y="45" width="840" height="230" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" filter="url(#glowBlue)" />

  <!-- Text Content (Guaranteed Foreground Visibility) -->
  <g text-anchor="middle">
    <!-- Icon / Logo Graphic -->
    <g transform="translate(600, 85)">
      <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="none" stroke="#38bdf8" stroke-width="2.5" />
      <circle cx="0" cy="0" r="6" fill="#60a5fa" />
      <line x1="0" y1="0" x2="0" y2="-22" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="0" y1="0" x2="19" y2="11" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="0" y1="0" x2="-19" y2="11" stroke="#38bdf8" stroke-width="1.5" />
    </g>

    <!-- Main Title -->
    <text x="600" y="152" class="title-text">Awesome Managed Graph Database ⚡</text>
    
    <!-- Subtitle -->
    <text x="600" y="195" class="subtitle-text">Curated Managed Graph Cloud Services &amp; High-Performance Open-Source Graph Engines</text>
    
    <!-- Badges / Pill Tags -->
    <g transform="translate(600, 235)">
      <!-- Pill 1 -->
      <rect x="-240" y="-14" width="140" height="26" rx="13" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <text x="-170" y="3" font-family="sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle">☁️ Managed SaaS</text>

      <!-- Pill 2 -->
      <rect x="-80" y="-14" width="160" height="26" rx="13" fill="#1e293b" stroke="#0ea5e9" stroke-width="1" />
      <text x="0" y="3" font-family="sans-serif" font-size="12" fill="#7dd3fc" text-anchor="middle">🚀 Open-Source Engines</text>

      <!-- Pill 3 -->
      <rect x="100" y="-14" width="140" height="26" rx="13" fill="#1e293b" stroke="#6366f1" stroke-width="1" />
      <text x="170" y="3" font-family="sans-serif" font-size="12" fill="#c7d2fe" text-anchor="middle">🤖 GraphRAG &amp; Vector</text>
    </g>
  </g>
</svg>
